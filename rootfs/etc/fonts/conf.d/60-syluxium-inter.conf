<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Syluxium (Dusk theme): the user-interface font is Inter (package
     fonts-inter); DejaVu Sans covers the characters it lacks. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Sans</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
