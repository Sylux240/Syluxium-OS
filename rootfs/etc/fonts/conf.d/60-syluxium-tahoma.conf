<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Syluxium: the desktop's user-interface font is Wine's free (LGPL)
     Tahoma replacement (package fonts-wine, linked into
     /usr/share/fonts/truetype/wine-tahoma) for the XP-era look; DejaVu Sans
     covers the characters it lacks. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Tahoma</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Sans</family>
    <prefer><family>Tahoma</family><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
