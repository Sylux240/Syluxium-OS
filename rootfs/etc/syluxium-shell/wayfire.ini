# Syluxium shell (Wayland): Wayfire configuration. syluxium-shell adds the
# blur plugin (glass panel and menus) when a GPU driver runs; on the firmware
# framebuffer (software rendering) blur misplaces the panel.
[core]
plugins = autostart decoration move resize alpha winshadows window-rules place
xwayland = true
close_top_view = <super> KEY_Q | <alt> KEY_F4

[decoration]
title_height = 32
border_size = 3
active_color = 0.114 0.145 0.322 1.0
inactive_color = 0.094 0.118 0.251 1.0
font = Inter 10

[blur]
method = kawase
kawase_offset = 2
kawase_degrade = 3
kawase_iterations = 3
blur_by_default = app_id is "syluxium-panel" | app_id is "syluxium-launcher" | type is "panel" | type is "overlay"

[autostart]
autostart_wf_shell = false
background = syluxium-wallpaper
panel = syluxium-panel
splash = sh -c 'echo done > /dev/splash' 
