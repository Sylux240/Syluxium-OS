# Syluxium shell (Wayland): Wayfire configuration, made to match the Xfce
# desktop: the Xfce session itself (xfce4-session, taskbar with the Whisker
# start menu, desktop) with the same settings (xfconf, /etc/xdg/syluxium),
# window frames from the same xfwm4 theme (syluxium-decor), shadows like
# xfwm4's, new windows centred, the same keyboard shortcuts.
# syluxium-shell adds the blur plugin when a GPU driver runs.
[core]
plugins = autostart syluxium-decor move resize winshadows window-rules place foreign-toplevel gtk-shell wayfire-shell command wm-actions fast-switcher xdg-activation
# X11 programs: Xwayland starts when the first one connects (DISPLAY is set
# from the start), through /usr/local/lib/syluxium/xwayland (WLR_XWAYLAND).
xwayland = lazy
preferred_decoration_mode = server
close_top_view = <alt> KEY_F4

[syluxium-decor]
theme = /usr/share/themes/Syluxium/xfwm4
title_font = Inter Semi-Bold 10
button_layout = O|HMC

# xfwm4's frame shadow (Dusk themerc: 45 % opacity, 2 px up, 4 px taller).
[winshadows]
shadow_color = \#00000073
shadow_radius = 12
vertical_offset = 0
horizontal_offset = 0
clip_shadow_inside = true
include_undecorated_views = false

[place]
mode = center

[move]
activate = <alt> BTN_LEFT

[resize]
activate = <alt> BTN_RIGHT

[fast-switcher]
activate = <alt> KEY_TAB
activate_backward = <alt> <shift> KEY_TAB

[wm-actions]
toggle_showdesktop = <super> KEY_D

# The Xfce desktop's shortcuts (xfce4-keyboard-shortcuts.xml).
[command]
binding_menu = <super> | <ctrl> KEY_ESC
command_menu = xfce4-popup-whiskermenu
binding_taskmgr = <ctrl> <shift> KEY_ESC
command_taskmgr = syluxium-taskmgr
binding_files = <super> KEY_E
command_files = thunar
binding_run = <super> KEY_R
command_run = xfce4-appfinder --collapsed
binding_terminal = <ctrl> <alt> KEY_T
command_terminal = exo-open --launch TerminalEmulator
binding_screenshot = KEY_SYSRQ
command_screenshot = xfce4-screenshooter
binding_logout = <ctrl> <alt> KEY_DELETE
command_logout = xfce4-session-logout

[blur]
method = kawase
kawase_offset = 2
kawase_degrade = 3
kawase_iterations = 3
blur_by_default = type is "panel" | type is "overlay"

[autostart]
autostart_wf_shell = false
# xfce4-session (as "startxfce4 --wayland" runs it): its Wayland session
# starts xfsettingsd, the taskbar, Thunar's daemon and the desktop, then
# the XFCE autostart entries (notifications, AutoPlay, ...); its logout
# dialog logs out, restarts and shuts down as in the Xfce desktop.
# (D-Bus starts services such as the notification bubbles: they need the display.)
# Logging out ends the session and Wayfire with it (syluxium-shell starts a new one).
session = sh -c 'dbus-update-activation-environment --all; xfce4-session; pkill -u "$(id -u)" -x wayfire'
setup = syluxium-shell-setup
splash = sh -c 'echo done > /dev/splash'
