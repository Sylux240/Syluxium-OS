# Syluxium shell (Wayland): Wayfire configuration. Bring-up stage.
[core]
plugins = autostart decoration move resize alpha blur winshadows animate window-rules place
xwayland = true
close_top_view = <super> KEY_Q | <alt> KEY_F4

[decoration]
title_height = 32
border_size = 3
active_color = 0.114 0.145 0.322 1.0
inactive_color = 0.094 0.118 0.251 1.0
font = Inter 10

[blur]
method = kawase
blur_by_default = type is "panel"

[autostart]
background = swaybg -i /opt/trinity/share/wallpapers/syluxium-default.jpg -m fill
