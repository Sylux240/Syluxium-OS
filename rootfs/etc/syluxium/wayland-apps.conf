# Start-menu entries that go through syluxium-wayland-run (Wayland windows
# in the Xfce desktop). Programs that can only use Wayland are found by
# themselves (syluxium-wayland-apps, run after every apt install); this
# file overrides that, one line per entry (the .desktop file's name):
#   wayland <name>.desktop    always run it as a Wayland program
#   x11 <name>.desktop        never (it stays as installed)
# Then run: sudo syluxium-wayland-apps
