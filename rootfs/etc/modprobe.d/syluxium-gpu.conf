# NVIDIA cards: the NVIDIA driver and nouveau both claim every one, so udev
# loads neither; syluxium-gpu-select picks one at start-up (the NVIDIA driver
# for the cards it supports, nouveau for the others; boot option nonvidia:
# nouveau). This also overrides Debian's nvidia-blacklists-nouveau.conf.
blacklist nvidia
blacklist nvidia-current
blacklist nvidia-current-drm
blacklist nouveau
# Kernel mode setting and a console frame buffer from the NVIDIA driver:
# the loading screen, the text console and the Wayland shell need them.
options nvidia-current-drm modeset=1 fbdev=1
