# The sound card: ALSA's own defaults for it (dmix: several programs play at
# once), on the card syluxium-sound-card chose at boot
# (/run/syluxium/sound-card.conf: the Linux kernel's card 0 is often a
# graphics card's HDMI output); card 0 without that file.
#
# Bluetooth headphones: while one is connected, syluxium-bluetooth-audio
# (started with the desktop) writes /run/syluxium/bluetooth-audio.conf to make
# it the default output; without that file the sound card above stays the
# default. Turned off with "off" in /etc/syluxium/bluetooth-audio.
@hooks [
	{
		func load
		files [ "/run/syluxium/sound-card.conf" "/run/syluxium/bluetooth-audio.conf" ]
		errors false
	}
]
