# Syluxium ALSA defaults: several programs can play (dmix) and record
# (dsnoop) at the same time on the first sound card, any rate/format/
# channel count through "plug". Shared by all users (ipc_perm 0666), so the
# login screen and the desktop session don't lock each other out.
pcm.!default {
	type asym
	playback.pcm "syluxium_play"
	capture.pcm "syluxium_capture"
}

pcm.syluxium_play {
	type plug
	slave.pcm "syluxium_dmix"
}

pcm.syluxium_capture {
	type plug
	slave.pcm "syluxium_dsnoop"
}

pcm.syluxium_dmix {
	type dmix
	ipc_key 5978293
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		channels 2
		period_size 1024
		buffer_size 8192
	}
}

pcm.syluxium_dsnoop {
	type dsnoop
	ipc_key 5978294
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		channels 2
		period_size 1024
		buffer_size 8192
	}
}

ctl.!default {
	type hw
	card 0
}
