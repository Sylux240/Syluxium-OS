# Syluxium ALSA defaults.
#
# The default device is the first card through the "plug" converter, so any
# rate/format/channel count works; mixer commands go to card 0.
# TODO: dmix/dsnoop (several programs at once) - System V shm and
# semaphores exist now, but dmix's open fails with EPIPE (to be debugged).
pcm.!default {
	type plug
	slave.pcm "hw:0,0"
}

ctl.!default {
	type hw
	card 0
}
