# Syluxium ALSA defaults.
#
# Debian's per-card defaults route "default" through dmix/dsnoop, which need
# System V shared memory and semaphores (not implemented yet). Until then the
# default device is the first card through the "plug" converter, so any
# rate/format/channel count works; mixer commands go to card 0.
pcm.!default {
	type plug
	slave.pcm "hw:0,0"
}

ctl.!default {
	type hw
	card 0
}
