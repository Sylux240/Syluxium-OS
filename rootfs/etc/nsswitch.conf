# Name service switch (Debian's default): local files first, then .local names
# on the local network (mDNS, through avahi: network printers), then DNS.
passwd:         files
group:          files
shadow:         files
gshadow:        files

hosts:          files mdns4_minimal [NOTFOUND=return] dns
networks:       files

protocols:      db files
services:       db files
ethers:         db files
rpc:            db files

netgroup:       nis
