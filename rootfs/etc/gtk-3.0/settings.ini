# Syluxium: GTK programs (Firefox, our system tools) use the desktop's Dusk
# colours and user-interface font (/usr/share/themes/Syluxium).
[Settings]
gtk-theme-name=Syluxium
gtk-application-prefer-dark-theme=true
gtk-font-name=Inter 10
# Icons: the desktop's Dusk set (/usr/share/icons/Syluxium links to it), then crystalsvg
gtk-icon-theme-name=Syluxium
gtk-menu-images=false
gtk-button-images=false
