# Syluxium X server configuration (until hot-plug through udev exists).
# The display driver (Device "Display") is chosen for this machine at
# boot by syluxium-display-config: xorg.conf.d/20-display.conf. event0 and event1 are the
# kernel's combined devices: every keyboard / every mouse (built in, PS/2,
# USB, plugged in later) arrives through them.
Section "ServerFlags"
    Option "AutoAddDevices"    "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch"      "true"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "Display"
    DefaultDepth 24
EndSection

Section "InputDevice"
    Identifier "Keyboard"
    Driver     "evdev"
    Option     "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "Mouse"
    Driver     "evdev"
    Option     "Device" "/dev/input/event1"
EndSection

Section "ServerLayout"
    Identifier  "Syluxium"
    Screen      "Screen0"
    InputDevice "Keyboard" "CoreKeyboard"
    InputDevice "Mouse"    "CorePointer"
EndSection
