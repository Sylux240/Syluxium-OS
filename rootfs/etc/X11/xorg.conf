# Syluxium X server configuration. The display driver (Device "Display") is
# chosen for this machine at boot by syluxium-display-config:
# xorg.conf.d/20-display.conf. Keyboards, mice and touchpads come and go
# through udev (hot-plug), with the libinput driver (evdev as the fallback).
Section "ServerFlags"
    Option "DontVTSwitch"      "true"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "Display"
    DefaultDepth 24
EndSection
