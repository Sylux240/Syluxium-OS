timeout: 3
default_entry: 1
# The boot splash from the moment an entry is picked: the logo (the kernel
# animates the load bar under it).
wallpaper: boot():/boot/limine/splash.png
wallpaper_style: centered
backdrop: 000000
# Transparent text background: the logo keeps its full brightness (as the kernel draws it).
term_background: ff000000
interface_branding: Syluxium
interface_help_hidden: yes

/Syluxium
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: desktop
    module_path: boot():/boot/initramfs.cpio

/Syluxium (text console)
    protocol: limine
    path: boot():/boot/syluxium.elf
    module_path: boot():/boot/initramfs.cpio

/Syluxium (safe mode: no ACPI interpreter, no power saving)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: desktop acpi=noaml nohz=off idle=hlt
    module_path: boot():/boot/initramfs.cpio

/Syluxium (GPU test)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: desktop gpu
    module_path: boot():/boot/initramfs.cpio

/Syluxium (Recovery)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: recovery
    module_path: boot():/boot/initramfs.cpio
