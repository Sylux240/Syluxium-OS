timeout: 3
default_entry: 1

/Syluxium
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: desktop
    module_path: boot():/boot/initramfs.cpio

/Syluxium (text console)
    protocol: limine
    path: boot():/boot/syluxium.elf
    module_path: boot():/boot/initramfs.cpio

/Syluxium (safe mode: no ACPI interpreter, no power saving)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: desktop acpi=noaml nohz=off idle=hlt
    module_path: boot():/boot/initramfs.cpio
