timeout: 3
# No "Loading ..." text over the splash picture.
quiet: yes
default_entry: 1
# The boot splash from the moment an entry is picked.
wallpaper: boot():/boot/limine/splash.png
wallpaper_style: centered
backdrop: 0b0f26
# Transparent text background: the logo keeps its full brightness.
term_background: ff000000
interface_branding: Syluxium
interface_help_hidden: yes
# Syluxium runs on the Linux kernel (/boot/vmlinuz); the small initrd finds the
# system on the stick's SYLUXLIVE (ext4) partition. The last entry loads the
# whole system into memory instead (slow to start, needs ~3 GiB of RAM; for
# sticks whose ext4 partition is damaged).

/Syluxium
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    cmdline: root=LABEL=SYLUXLIVE rw desktop quiet splash loglevel=3

/Syluxium (safe mode: no GPU drivers)
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    cmdline: root=LABEL=SYLUXLIVE rw desktop nomodeset

/Syluxium (text console)
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    cmdline: root=LABEL=SYLUXLIVE rw

/Syluxium (Recovery)
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    cmdline: root=LABEL=SYLUXLIVE rw recovery

/Syluxium (Wayland desktop preview)
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    cmdline: root=LABEL=SYLUXLIVE rw desktop shell quiet splash

/Syluxium (in memory: whole system in RAM)
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.cpio
    cmdline: rdinit=/sbin/init rootfstype=ramfs desktop quiet splash
