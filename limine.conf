timeout: 3
# No "Loading ..." text over the splash picture.
quiet: yes
default_entry: 1
# The boot splash from the moment an entry is picked: the logo (the kernel
# animates the load bar under it).
wallpaper: boot():/boot/limine/splash.png
wallpaper_style: centered
backdrop: 0b0f26
# Transparent text background: the logo keeps its full brightness (as the kernel draws it).
term_background: ff000000
interface_branding: Syluxium
interface_help_hidden: yes
# The system lives on the stick's SYLUXLIVE (ext4) partition and is read from
# it as needed. The last entry loads all of it into memory instead (slow to
# start, needs ~3 GiB of RAM; for sticks whose ext4 partition is damaged).

/Syluxium
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE desktop

/Syluxium (text console)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE

/Syluxium (safe mode)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE desktop acpi=noaml nohz=off idle=hlt

/Syluxium (GPU test)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE desktop gpu

/Syluxium (GPU test, no acceleration)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE desktop gpu noaccel

/Syluxium (GPU test: AMD video, trace)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE desktop gpu drmtrace vaapi amdgpu.pg_mask=0 logfast

/Syluxium (GPU test: AMD video on, trace)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE desktop gpu drmtrace vaapi amdgputest logfast

/Syluxium (Recovery)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE recovery

/Syluxium (new shell: Wayland preview)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE desktop shell

/Syluxium (new shell with GPU: Wayland preview)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: root=LABEL=SYLUXLIVE desktop shell gpu

/Syluxium (in memory: whole system in RAM)
    protocol: limine
    path: boot():/boot/syluxium.elf
    cmdline: desktop
    module_path: boot():/boot/initramfs.cpio
